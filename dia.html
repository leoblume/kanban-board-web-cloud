<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programação do Dia</title>
  <link rel="stylesheet" href="dia.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script type="module" src="dia.js" defer></script>
</head>
<body>
  <div class="dia-wrapper">
    <nav class="dia-topo">
      <a href="index.html" id="btn-principal" class="dia-btn-nav">← Voltar ao Principal</a>
      <span id="dia-contador" class="dia-contador"></span>
    </nav>
    <header class="dia-header">
      <a id="btn-anterior" class="dia-seta" href="#" title="Dia anterior" aria-label="Dia anterior">‹</a>
      <h1 id="dia-titulo">Programação do Dia</h1>
      <a id="btn-proximo" class="dia-seta" href="#" title="Próximo dia" aria-label="Próximo dia">›</a>
    </header>

    <div id="dia-lista" class="dia-lista"></div>
  </div>

  <!-- Gaveta lateral: aba discreta na borda direita que abre a lista de OS -->
  <aside id="gaveta-os" class="dia-gaveta" aria-hidden="true">
    <button id="gaveta-aba" class="dia-aba" type="button" aria-expanded="false" aria-controls="gaveta-os" title="Adicionar pedidos a este dia">+ Adicionar OS</button>
    <div class="dia-gaveta-conteudo">
      <div class="dia-gaveta-topo">
        <strong>Adicionar pedidos ao dia</strong>
        <button id="gaveta-fechar" class="dia-gaveta-fechar" type="button" title="Fechar">×</button>
      </div>
      <input id="busca-os" type="text" placeholder="Pesquisar Cliente ou OS...">
      <div id="lista-os" class="dia-lista-os"></div>
    </div>
  </aside>

  <div class="dia-legend">
    <span><i class="c arte"></i>Arte Final</span>
    <span><i class="c impressao"></i>Impressão</span>
    <span><i class="c acabamento"></i>Acabamento</span>
    <span><i class="c corte"></i>Corte</span>
    <span><i class="c serralheria"></i>Serralheria</span>
    <span><i class="c instalacao"></i>Instalação</span>
  </div>
</body>
</html>
